# herdr-plugin.toml registers Herdr Mobile Relay with herdr as a plugin.
# Install it with `herdr plugin install 0cv/herdr-mobile-relay` (herdr clones
# this repo, runs the [[build]] pre-warm below after confirmation, and
# registers the entry points), or `herdr plugin link .` from a local checkout.
#
# Every install and upgrade schedules the Setup action after the build finishes,
# so transport and self-hosted gateway status are visible immediately. Invoke it
# explicitly as a universal fallback, or set
# HERDR_MOBILE_RELAY_NO_AUTO_SETUP=1 to suppress it:
#   herdr plugin action invoke setup --plugin herdr-mobile-relay.events
# or bind keys in herdr's config.toml and `herdr server reload-config`:
#   [[keys.command]]
#   key = "prefix+m"
#   type = "plugin_action"
#   command = "herdr-mobile-relay.events.setup"
#   description = "Herdr Mobile Relay: Setup"

id = "herdr-mobile-relay.events"
name = "Herdr Mobile Relay"
version = "0.18.3"
# Herdr 0.7.5 introduced the live-agent facade used for atomic starts and prompts.
min_herdr_version = "0.7.5"
description = "Remote mobile control for Herdr: approve and monitor agents from your smartphone (Android/iOS) with an installable web app, push notifications, QR pairing, and a blind gateway plus direct WebRTC transport (Cloudflare tunnels remain supported)"
platforms = ["macos", "linux"]

# Install the exact versioned, checksum- and manifest-verified release bundle.
# This never compiles Go and has no Python, uv, Node, Git, or toolchain
# dependency. With HERDR_GATEWAY_URL set, Quick Start needs no Cloudflare
# account at all; otherwise cloudflared remains an interactive Quick Start
# decision because it opens a public tunnel.
[[build]]
command = ["bash", "relay/plugin-build.sh"]

# setup — the post-install chooser. The build schedules this automatically
# after Herdr registers the new manifest when it can identify a safe terminal
# destination; users can always invoke it directly as a fallback.
[[actions]]
id = "setup"
title = "Herdr Mobile Relay: Setup"
command = ["bash", "relay/open-plugin-pane.sh", "setup"]


# quick-start — starts a foreground trial when no service is installed. With an
# existing background service it restarts that service and prints its current
# setup QR rather than racing it for the relay port. The flattened Setup action
# normally selects the transport and enters this path in one step; this action
# remains as a direct fallback.
[[actions]]
id = "quick-start"
title = "Herdr Mobile Relay: Start or Restart Relay"
command = ["bash", "relay/open-plugin-pane.sh", "quick-start"]

# install-service — the permanent Cloudflare path: provisions or resumes a
# dedicated named Cloudflare tunnel, installs the service, verifies public
# relay identity, and only then prints the stable setup QR code.
[[actions]]
id = "install-service"
title = "Herdr Mobile Relay: Stable Cloudflare Tunnel Setup"
command = ["bash", "relay/open-plugin-pane.sh", "install-service"]

# setup-link — reprints the private phone link and QR for the installed relay,
# on either the gateway or the stable tunnel path. The wrapper follows the
# service's recorded relay environment so it also works when a Marketplace
# action manages a checkout-installed service.
[[actions]]
id = "setup-link"
title = "Herdr Mobile Relay: Show Phone Setup QR"
command = ["bash", "relay/open-plugin-pane.sh", "setup-link"]

# change-hostname — moves a tunnel relay to another public name. The tunnel,
# its credentials, and the relay token stay, so paired phones only need the new
# link; the old record keeps answering until it is deleted.
[[actions]]
id = "change-hostname"
title = "Herdr Mobile Relay: Change Tunnel Hostname"
command = ["bash", "relay/open-plugin-pane.sh", "change-hostname"]

# configure-app-deploy — opts one stable relay into deploying a separately
# hosted Cloudflare Pages app after explicit confirmation from the phone.
[[actions]]
id = "configure-app-deploy"
title = "Herdr Mobile Relay: Configure App Deployment"
command = ["bash", "relay/open-plugin-pane.sh", "configure-app-deploy"]

# stable-teardown — explicit confirmed cleanup before plugin uninstall. Herdr
# keeps plugin config/state on uninstall and has no manifest uninstall hook.
[[actions]]
id = "stable-teardown"
title = "Herdr Mobile Relay: Stable Tunnel Teardown"
command = ["bash", "relay/open-plugin-pane.sh", "stable-teardown"]

[[actions]]
id = "uninstall"
title = "Herdr Mobile Relay: Full Uninstall"
command = ["bash", "relay/open-plugin-pane.sh", "uninstall"]

# status — a smoke test for support: shows the resolved config, background
# service state, and the local relay health endpoint, then waits for Enter.
[[actions]]
id = "status"
title = "Herdr Mobile Relay: Status"
command = ["bash", "relay/open-plugin-pane.sh", "status"]

# The interactive halves of the actions above. herdr opens each in a managed
# pane, runs the script, and tears the pane down when it exits.
[[panes]]
id = "setup"
title = "Herdr Mobile Relay: Setup"
placement = "zoomed"
command = ["bash", "relay/plugin-setup-menu.sh"]


[[panes]]
id = "quick-start"
title = "Herdr Mobile Relay: Start or Restart Relay"
placement = "zoomed"
command = ["bash", "relay/plugin-quick-start.sh"]

[[panes]]
id = "install-service"
title = "Herdr Mobile Relay: Stable Cloudflare Tunnel Setup"
placement = "zoomed"
command = ["bash", "relay/plugin-install-service.sh"]

[[panes]]
id = "setup-link"
title = "Herdr Mobile Relay: Show Phone Setup QR"
placement = "zoomed"
command = ["bash", "relay/plugin-setup-link.sh"]

[[panes]]
id = "change-hostname"
title = "Herdr Mobile Relay: Change Tunnel Hostname"
placement = "zoomed"
command = ["bash", "relay/plugin-change-hostname.sh"]

[[panes]]
id = "configure-app-deploy"
title = "Herdr Mobile Relay: Configure App Deployment"
placement = "zoomed"
command = ["bash", "relay/plugin-configure-app-deploy.sh"]

[[panes]]
id = "stable-teardown"
title = "Herdr Mobile Relay: Stable Tunnel Teardown"
placement = "zoomed"
command = ["bash", "relay/plugin-stable-teardown.sh"]

[[panes]]
id = "uninstall"
title = "Herdr Mobile Relay: Full Uninstall"
placement = "zoomed"
command = ["bash", "relay/uninstall.sh"]

[[panes]]
id = "status"
title = "Herdr Mobile Relay: Status"
placement = "overlay"
command = ["bash", "relay/plugin-status.sh"]

# herdr fires pane.agent_status_changed whenever a local agent's status
# changes; the hook forwards it over UDP to the local relay so phones see
# blocked/finished transitions instantly instead of on the next poll. herdr
# runs this for you — never invoke it by hand. Output is captured in
# `herdr plugin log list --plugin herdr-mobile-relay.events`.
[[events]]
on = "pane.agent_status_changed"
command = ["sh", "relay/plugin-on-event.sh"]
