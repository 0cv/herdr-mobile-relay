version: 2

project_name: herdr-mobile-relay

before:
  hooks:
    - go mod tidy
    - npm --prefix frontend ci
    - npm --prefix frontend run build

builds:
  - id: herdr-mobile-relay
    binary: herdr-mobile-relay
    main: ./cmd/herdr-mobile-relay
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.revision={{ .ShortCommit }}

archives:
  - id: default
    formats: [binary]

checksum:
  name_template: "build-checksums.txt"

release:
  extra_files:
    - glob: ./dist/release/*

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"
