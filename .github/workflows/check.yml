name: check

on:
  push:
    branches: [main, dev, ci/tailscale-native-preflight-ef9f843]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  provenance:
    name: Exact checkout provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify event commit, clean state, modes, bytes, and source membership
        run: python3 scripts/verify-checkout-provenance.py --expected-sha "$GITHUB_SHA"
      - name: Exercise provenance refusal cases in disposable Git fixtures
        run: python3 tests/test_checkout_provenance.py

  go:
    needs: provenance
    name: Go quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Format
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './frontend/node_modules/*'))"
      - name: Lint GitHub workflows with pinned actionlint
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -shellcheck= -pyflakes= .github/workflows/check.yml
          .github/workflows/mobile-ci.yml .github/workflows/release.yml
          .github/workflows/tailscale-native-preflight.yml
      - run: go vet ./...
      - run: go test ./...

  journal:
    needs: provenance
    name: Linux journald logging acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Run opt-in user-journal integration test
        env:
          HERDR_TEST_JOURNAL: "1"
        run: go test ./cmd/herdr-mobile-relay -run '^TestJournalIntegration$' -count=1 -v

  # The race detector more than doubles the Go suite, and the shell suites are
  # unrelated to it. Both used to sit behind `go test` in one serial job and
  # decided when every later job could start.
  race:
    needs: provenance
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - run: go test -race ./...

  shell:
    needs: provenance
    name: Shell and production paths
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      # Makefile's PATH assignment is an ordinary makefile variable and can
      # otherwise reintroduce host tools/adapters after a clean step env.
      - name: Run shell checks with a closed tool environment
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          env -i \
            HOME="$HOME" TMPDIR="$RUNNER_TEMP" PATH=/usr/bin:/bin \
            BASH_ENV=/dev/null ENV=/dev/null \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            /usr/bin/make PATH=/usr/bin:/bin \
              --eval='assert-shell-tools: ; @test "$$(command -v bash)" = /usr/bin/bash && test "$$(command -v sed)" = /usr/bin/sed' \
              assert-shell-tools shell-check production-path-audit

  frontend:
    needs: provenance
    name: Frontend and mobile browsers (Bun 1.4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - run: bun install --frozen-lockfile --cwd frontend
      # Native browsers instead of the multi-GB Playwright container image:
      # the binaries are the same Playwright-pinned builds either way, and no
      # assertion in the suite depends on the image's font set. Ubuntu is a
      # supported install-deps target; Fedora is not, which is why the
      # container path in run-browser-tests.sh stays for local Fedora runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - run: cd frontend && bun x playwright install --with-deps chromium webkit
      - run: make frontend-check
      - run: make web-release-check

  # Bundles are one of the things this workflow checks, not something it
  # publishes, so they no longer wait behind the test jobs: a red run fails on
  # its own job and a green run stops paying for the serial hop.
  release:
    needs: provenance
    name: Complete release bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Build, manifest, checksum, and offline-verify four targets
        run: |
          make cross-build
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml)"
          scripts/package-release.sh "$version" "$GITHUB_SHA" dist/release
          scripts/check-installed-release.sh \
            "dist/release/herdr-mobile-relay_${version}_linux_amd64.tar.gz" \
            dist/release/checksums.txt "$version" "$GITHUB_SHA" linux/amd64
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundles
          path: dist/release/
          retention-days: 1

  release-native-smoke:
    name: Native release smoke (${{ matrix.target }})
    needs: [release, provenance]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: macos-15
            target: darwin_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-bundles
          path: dist/release
      - name: Exercise packaged relay on its native target
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml)"
          target="${{ matrix.target }}"
          scripts/check-installed-release.sh \
            "dist/release/herdr-mobile-relay_${version}_${{ matrix.target }}.tar.gz" \
            dist/release/checksums.txt "$version" "$GITHUB_SHA" \
            "${target%_*}/${target#*_}"

  mobile-host-check:
    needs: provenance
    name: Mobile harness checks
    # The sentinel ref is not in the current push/PR triggers; mobile remains disabled.
    if: ${{ github.ref == 'refs/heads/__mobile-ci-disabled__' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Install required XML test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      - run: make mobile-ci-check

  mobile:
    name: Mobile device CI
    # The sentinel ref is not in the current push/PR triggers; mobile remains disabled.
    if: ${{ github.ref == 'refs/heads/__mobile-ci-disabled__' }}
    needs: [release, mobile-host-check, provenance]
    uses: ./.github/workflows/mobile-ci.yml
    with:
      artifact_run_id: ${{ github.run_id }}
      artifact_name: release-bundles
      candidate_commit: ${{ github.sha }}
      head_commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      platform: all
      suite: ${{ github.ref == 'refs/heads/dev' && 'smoke' || 'release' }}
      baseline_set: ${{ github.ref == 'refs/heads/dev' && 'latest' || 'all' }}
    permissions:
      actions: read
      contents: read
