name: check

on:
  push:
    branches: [main, dev, ci/tailscale-native-preflight-ef9f843]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  provenance:
    name: Exact checkout provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify event commit, clean state, modes, bytes, and source membership
        run: python3 scripts/verify-checkout-provenance.py --expected-sha "$GITHUB_SHA"
      - name: Exercise provenance refusal cases in disposable Git fixtures
        run: python3 tests/test_checkout_provenance.py

  go:
    needs: provenance
    name: Go quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - name: Format
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './frontend/node_modules/*'))"
          if [ -n "$unformatted" ]; then
            echo 'gofmt reports unformatted Go files:'
            echo "$unformatted"
            printf '%s\n' "$unformatted" | xargs gofmt -d | head -n 200 || true
            exit 1
          fi
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Lint CLI lifecycle shell scripts
        run: shellcheck --severity=warning -x -P relay relay/dev-tailscale-cli.sh relay/tailscale-cli.sh
      - name: Lint GitHub workflows with pinned actionlint
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -shellcheck= -pyflakes= .github/workflows/check.yml
          .github/workflows/mobile-ci.yml .github/workflows/release.yml
          .github/workflows/service-qualification.yml
          .github/workflows/service-full-qualification.yml
          .github/workflows/resume-benchmark.yml
          .github/workflows/tailscale-native-preflight.yml
          .github/workflows/native-manager-lifecycle.yml
      - run: go vet ./...
      # Handoff fixtures require a caller-supplied canonical short temp parent.
      - run: go test -p 1 ./...
        env:
          TMPDIR: /tmp

  tailscale-app-integration:
    needs: provenance
    name: Managed Tailscale app/control integration (${{ matrix.mode }}, hosted, no credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - name: Run exact required app/control cases and write sanitized SHA-bound evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "candidate_sha=$GITHUB_SHA"
          log="$RUNNER_TEMP/tailscale-app-integration-${{ matrix.mode }}.jsonl"
          diagnostics="$RUNNER_TEMP/tailscale-app-integration-${{ matrix.mode }}.stderr"
          evidence="$RUNNER_TEMP/tailscale-app-integration-evidence-${{ matrix.mode }}.json"
          pattern='^(TestManagedTailscaleHostedPositiveActivationArmEnrollAndRetire|TestManagedTailscaleDelayedVerifierCompletesWithinLifecycleBudgets|TestManagedTailscaleVerifierCancellationDoesNotPersistInvitation|TestManagedTailscaleLaterAdmissionFailuresDoNotPersistInvitation|TestManagedTailscaleCommittedArmSurvivesLostControlAcknowledgement|TestManagedTailscaleWatchEOFAtAdmissionHandoffNeverReopensOrEnrolls|TestManagedTailscaleRearmAfterEnrollmentAndLostAcknowledgement|TestTailscaleCLIReadinessArmAndDrift)$'
          if [[ "${{ matrix.mode }}" == race ]]; then
            if go test -json -race -tags=herdr_tailscale_test ./internal/app -run "$pattern" -count=1 >"$log" 2>"$diagnostics"; then
              test_exit=0
            else
              test_exit=$?
            fi
          else
            if go test -json -tags=herdr_tailscale_test ./internal/app -run "$pattern" -count=1 >"$log" 2>"$diagnostics"; then
              test_exit=0
            else
              test_exit=$?
            fi
          fi
          cat "$diagnostics" >&2
          python3 - "$log" "$evidence" "$GITHUB_SHA" "${{ matrix.mode }}" "$test_exit" <<'PY'
          import json
          import pathlib
          import sys

          log_path, evidence_path, candidate_sha, mode, test_exit_text = sys.argv[1:]
          required = [
              "TestManagedTailscaleHostedPositiveActivationArmEnrollAndRetire",
              "TestManagedTailscaleDelayedVerifierCompletesWithinLifecycleBudgets",
              "TestManagedTailscaleVerifierCancellationDoesNotPersistInvitation",
              "TestManagedTailscaleLaterAdmissionFailuresDoNotPersistInvitation",
              "TestManagedTailscaleCommittedArmSurvivesLostControlAcknowledgement",
              "TestManagedTailscaleWatchEOFAtAdmissionHandoffNeverReopensOrEnrolls",
              "TestManagedTailscaleRearmAfterEnrollmentAndLostAcknowledgement",
              "TestTailscaleCLIReadinessArmAndDrift",
          ]
          actions = {}
          observed_tests = set()
          parse_failed = False
          with pathlib.Path(log_path).open(encoding="utf-8") as stream:
              for line in stream:
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      parse_failed = True
                      continue
                  name = event.get("Test")
                  if name:
                      observed_tests.add(name)
                      actions.setdefault(name, []).append(event.get("Action"))

          results = []
          for name in required:
              terminal = [action for action in actions.get(name, []) if action in {"pass", "skip", "fail"}]
              descendants = [
                  action
                  for test_name, test_actions in actions.items()
                  if test_name.startswith(name + "/")
                  for action in test_actions
                  if action in {"skip", "fail"}
              ]
              if "fail" in terminal or "fail" in descendants:
                  result = "fail"
              elif "skip" in terminal or "skip" in descendants:
                  result = "skip"
              elif terminal == ["pass"] and not descendants:
                  result = "pass"
              elif not terminal:
                  result = "missing"
              else:
                  result = "invalid-event-count"
              results.append({"name": name, "result": result})

          try:
              test_exit = int(test_exit_text)
          except ValueError:
              test_exit = 1
              parse_failed = True
          passed = (
              test_exit == 0
              and bool(observed_tests)
              and all(case["result"] == "pass" for case in results)
              and not parse_failed
          )
          evidence = {
              "schema_version": 1,
              "candidate_sha": candidate_sha,
              "mode": mode,
              "go_test_exit_code": test_exit,
              "test_cases_observed": len(observed_tests),
              "required_cases": results,
              "json_parse_complete": not parse_failed,
              "result": "pass" if passed else "fail",
          }
          pathlib.Path(evidence_path).write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          if not passed:
              print("required tagged integration cases failed evidence validation", file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Upload sanitized integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailscale-app-integration-evidence-${{ matrix.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/tailscale-app-integration-evidence-${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 1

  installed-inert:
    needs: provenance
    name: Installed inert (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            mode: normal
          - runner: ubuntu-24.04
            os: Linux
            mode: race
          - runner: macos-15
            os: Darwin
            mode: normal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean checkout
        run: python3 scripts/verify-checkout-provenance.py --expected-sha "$GITHUB_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Test evidence refusals offline
        run: python3 -I -B tests/test_installed_inert.py
      - name: Require exact installed inert invocations and sanitized evidence
        env:
          TMPDIR: ${{ matrix.os == 'Darwin' && '/private/tmp' || '/tmp' }}
        run: >-
          python3 -I -B scripts/ci/installed_inert.py
          --mode '${{ matrix.mode }}' --os '${{ matrix.os }}'
          --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          --evidence '${{ runner.temp }}/installed-inert-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.mode }}.json'
      - name: Upload only sanitized installed evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-inert-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/installed-inert-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 1

  installed-hosted:
    needs: provenance
    name: Installed hosted real Run and endpoint (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            mode: normal
          - runner: ubuntu-24.04
            os: Linux
            mode: race
          - runner: macos-15
            os: Darwin
            mode: normal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean checkout
        run: python3 scripts/verify-checkout-provenance.py --expected-sha "$GITHUB_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Test evidence refusals offline
        run: python3 -I -B tests/test_installed_hosted.py
      - name: Require exact installed hosted cases and sanitized evidence
        env:
          HERDR_INSTALLED_HOSTED_TEST: "1"
          TMPDIR: ${{ matrix.os == 'Darwin' && '/private/tmp' || '/tmp' }}
        run: >-
          python3 -I -B scripts/ci/installed_hosted.py
          --mode '${{ matrix.mode }}' --os '${{ matrix.os }}'
          --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          --evidence '${{ runner.temp }}/installed-hosted-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.mode }}.json'
      - name: Upload only sanitized installed evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-hosted-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/installed-hosted-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 1

  journal:
    needs: provenance
    name: Linux journald logging acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - name: Run opt-in user-journal integration test
        env:
          HERDR_TEST_JOURNAL: "1"
        run: go test ./cmd/herdr-mobile-relay -run '^TestJournalIntegration$' -count=1 -v

  # The race detector more than doubles the Go suite, and the shell suites are
  # unrelated to it. Both used to sit behind `go test` in one serial job and
  # decided when every later job could start.
  race:
    needs: provenance
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - run: go test -race -p 1 ./...
        env:
          TMPDIR: /tmp

  go-darwin:
    needs: provenance
    name: Go Darwin ACL, doctor and support (macos-15)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Run the real-ACL tests on macOS; every required one must pass, a skip fails
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -s)" = Darwin
          log="$RUNNER_TEMP/go-darwin-test.jsonl" err="$RUNNER_TEMP/go-darwin-test.stderr"
          go test -json -count=1 ./internal/darwinacl ./internal/doctor ./internal/support >"$log" 2>"$err" && go_exit=0 || go_exit=$?
          go test -json -count=1 ./cmd/herdr-mobile-relay -run '^TestSupportCommandProjectsLoadedPrivateState$' >>"$log" 2>>"$err" || go_exit=$?
          go test -json -count=1 ./cmd/herdr-mobile-relay -run '^(TestDarwinSelectedConfigAndRequiredBundleUnknown|TestDiagnosticActualLocalCompositionStillIncomplete|TestDiagnosticActualBundleCompositionRemainsPartialAndPrivate|TestDiagnosticNonexecutablePackageAfterDiscoveryIsObservedFailure|TestDiagnosticBundleFailureUnknownPriorityAndLateResult)$' >>"$log" 2>>"$err" || go_exit=$?
          [ "$go_exit" = 0 ] || tail -n 5 "$err" | cut -c1-200 >&2
          python3 - "$log" "$go_exit" <<'PY'
          import json
          import sys

          def reject(constant):
              raise ValueError(constant)

          log, go_exit = sys.argv[1:]
          required = {
              "internal/darwinacl": ["TestRealPlainObjectsHaveNoACLOnAnAllowedVolume"],
              "internal/doctor": ["TestDarwinHostedRealACLGrant", "TestDarwinHostedRealDirectoryACL", "TestInstalledBundleDarwinACLWriterSafetyRemainsUnknownBeforeReads",
                                  "TestDarwinHostedPackageIdentityACLFreeAndGrantRefusal", "TestDarwinHostedBundleACLFreePositive", "TestDarwinHostedBundleACLGrantRefusals"],
              "internal/support": ["TestLoadDarwinHostedRealACL"],
              "cmd/herdr-mobile-relay": ["TestSupportCommandProjectsLoadedPrivateState", "TestDarwinSelectedConfigAndRequiredBundleUnknown", "TestDiagnosticActualLocalCompositionStillIncomplete", "TestDiagnosticActualBundleCompositionRemainsPartialAndPrivate", "TestDiagnosticNonexecutablePackageAfterDiscoveryIsObservedFailure", "TestDiagnosticBundleFailureUnknownPriorityAndLateResult"],
          }
          module = [line.split()[1] for line in open("go.mod") if line.startswith("module ")][0]
          ends, unparsed = {}, 0
          for line in open(log, errors="replace"):
              try:
                  event = json.loads(line, parse_constant=reject)
                  action = event["Action"]
              except (ValueError, TypeError, KeyError):
                  action = None
              if not isinstance(action, str):
                  unparsed += 1
                  continue
              if action in ("pass", "fail", "skip"):
                  ends.setdefault((event.get("Package"), event.get("Test")), []).append(action)
          problems = [] if go_exit == "0" else ["go test exited " + go_exit[:8]]
          if unparsed:
              problems.append("%d log lines were not JSON events with an Action" % unparsed)
          for package, names in required.items():
              path = module + "/" + package
              expected_package_ends = ["pass"] * (2 if package == "cmd/herdr-mobile-relay" else 1)
              if ends.get((path, None)) != expected_package_ends:
                  problems.append("%s: package ended %s" % (package, ends.get((path, None)) or "missing"))
              for name in names:
                  nested = [test for (pkg, test), got in ends.items() if pkg == path and (test or "").startswith(name + "/") and got != ["pass"]]
                  if ends.get((path, name)) != ["pass"] or nested:
                      problems.append("%s:%s ended %s%s" % (package, name, ends.get((path, name)) or "missing", ", subtests not passed: %s" % nested[:3] if nested else ""))
          if problems:
              sys.exit("go-darwin: required real-ACL evidence is not met:\n  " + "\n  ".join(problems[:20]))
          print("go-darwin: all %d required real-ACL tests passed in their own packages; go test exited 0" % sum(map(len, required.values())))
          PY

  shell:
    needs: provenance
    name: Shell and production paths
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      # Makefile's PATH assignment is an ordinary makefile variable and can
      # otherwise reintroduce host tools/adapters after a clean step env.
      # shell-check-ci-complement is `make shell-check` minus the native-install (with its nested dispatch, doctor
      # and setup-menu suites), full-uninstall and uninstall-CLI suites. Those are required runs of the Service
      # qualification workflows on every event this workflow runs on (fast on pushes, full on pull requests; see
      # docs/ci-test-tiers.md), so they are not repeated here. The complete default stays `make shell-check`.
      - name: Run shell checks with a closed tool environment
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          go_bin_dir="$(dirname "$(command -v go)")"
          bun_bin_dir="$(dirname "$(command -v bun)")"
          node_bin_dir="$(dirname "$(command -v node)")"
          evidence="$RUNNER_TEMP/tailscale-external-evidence.json"
          env -i \
            HOME="$HOME" TMPDIR="$RUNNER_TEMP" PATH="$go_bin_dir:$bun_bin_dir:$node_bin_dir:/usr/bin:/bin" \
            GOTOOLCHAIN=local GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            HERDR_TAILSCALE_LAUNCHER_CI=1 \
            HERDR_EXTERNAL_FIXTURE_EVIDENCE="$evidence" \
            BASH_ENV=/dev/null ENV=/dev/null \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            /usr/bin/make PATH="$go_bin_dir:$bun_bin_dir:$node_bin_dir:/usr/bin:/bin" \
              --eval='assert-shell-tools: ; @test "$$(command -v bash)" = /usr/bin/bash && test "$$(command -v sed)" = /usr/bin/sed' \
              assert-shell-tools shell-check-ci-complement production-path-audit
      - name: Upload sanitized operator-owned Serve behavioral evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailscale-external-behavior-${{ github.sha }}
          path: ${{ runner.temp }}/tailscale-external-evidence.json
          if-no-files-found: error
          retention-days: 1

  frontend:
    needs: provenance
    name: Frontend and mobile browsers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Assert shell Node runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.13.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - run: bun install --frozen-lockfile --cwd frontend
      # Native browsers instead of the multi-GB Playwright container image:
      # the binaries are the same Playwright-pinned builds either way, and no
      # assertion in the suite depends on the image's font set. Ubuntu is a
      # supported install-deps target; Fedora is not, which is why the
      # container path in run-browser-tests.sh stays for local Fedora runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      # The Ubuntu mirror has taken from 30 s to more than 44 min to serve the
      # WebKit system packages, so the downloaded packages are cached as well.
      # They are saved right after the install, even if a later check fails.
      - id: playwright-apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: Keep browser system packages for the cache
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/playwright-apt/partial"
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/playwright-apt" \
            | sudo tee /etc/apt/apt.conf.d/90-playwright-archives >/dev/null
      - run: cd frontend && bun x playwright install --with-deps chromium webkit
      - name: Preflight supported resume paint composition (both engines)
        run: >-
          cd frontend && HERDR_WEB_ROOT="$GITHUB_WORKSPACE/web"
          bun x playwright test tests/browser/resume.spec.ts
          --grep 'paint composition preflight$' --retries=0 --workers=1
      - name: Let the cache read the browser system packages
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/playwright-apt"
      - if: steps.playwright-apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright-apt.outputs.cache-primary-key }}
      - run: make PATH="$PATH" frontend-check
      - run: make PATH="$PATH" web-release-check
      # A hung browser leaves only a timeout in the log. The failing tests'
      # Playwright traces (synthetic fixture data) show what the page was doing.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 1
          if-no-files-found: ignore

  # Bundles are one of the things this workflow checks, not something it
  # publishes, so they no longer wait behind the test jobs: a red run fails on
  # its own job and a green run stops paying for the serial hop.
  release:
    needs: provenance
    name: Complete release bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Assert shell Node runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.13.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Build, manifest, checksum, and offline-verify four targets
        run: |
          make cross-build
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml)"
          scripts/package-release.sh "$version" "$GITHUB_SHA" dist/release
          scripts/check-installed-release.sh \
            "dist/release/herdr-mobile-relay_${version}_linux_amd64.tar.gz" \
            dist/release/checksums.txt "$version" "$GITHUB_SHA" linux/amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundles
          path: dist/release/
          overwrite: true
          retention-days: 1

  release-native-smoke:
    name: Native release smoke (${{ matrix.target }})
    needs: [release, provenance]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: macos-15
            target: darwin_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundles
          path: dist/release
      - name: Exercise packaged relay on its native target
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml)"
          target="${{ matrix.target }}"
          scripts/check-installed-release.sh \
            "dist/release/herdr-mobile-relay_${version}_${{ matrix.target }}.tar.gz" \
            dist/release/checksums.txt "$version" "$GITHUB_SHA" \
            "${target%_*}/${target#*_}"

  tailscale-extracted-package-browser:
    needs: [release, provenance]
    name: Extracted-package Tailscale browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v8
        with:
          name: release-bundles
          path: dist/release
      - name: Install locked browser tooling and prepare fake Herdr fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -m 700 -p "$RUNNER_TEMP/tailscale-package-browser-evidence"
          printf '{"schema_version":1,"candidate_sha":"%s","current_stage":"runner_image_build","expected_case_count":16,"executed_case_count":0,"result":"not_run"}\n' "$GITHUB_SHA" > "$RUNNER_TEMP/tailscale-package-browser-evidence/tailscale-extracted-package-browser.json"
          bun install --frozen-lockfile --cwd frontend
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml)"
          test -n "$version"
          go build -trimpath -o "$RUNNER_TEMP/fake-herdr" ./cmd/fake-herdr
          playwright_version="$(node -p "require('./frontend/package.json').devDependencies['@playwright/test']")"
          test "$(grep '^FROM ' tests/tailscale-package-browser.Dockerfile)" = "FROM mcr.microsoft.com/playwright:v${playwright_version}-noble"
          printf 'HERDR_PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Compile test-only production dev setup-link printer
        run: go test -c -o "$RUNNER_TEMP/dev-setup-link-printer.test" ./cmd/herdr-mobile-relay
      - name: Build pinned disposable runner image
        run: cd tests && docker build --pull --tag herdr-tailscale-package-browser --file tailscale-package-browser.Dockerfile .
      - name: Run exact release archive in network-disabled package fixture
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --add-host relay.tailnet.ts.net:127.0.0.1 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777,size=1g \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --mount "type=bind,src=$PWD/dist/release,dst=/artifact,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/fake-herdr,dst=/fixture-bin/fake-herdr,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/dev-setup-link-printer.test,dst=/fixture-bin/dev-setup-link-printer.test,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/tailscale-package-browser-evidence,dst=/evidence" \
            --env HERDR_EXTRACTED_PACKAGE_BROWSER_CI=1 \
            --env HERDR_PACKAGE_VERSION="$HERDR_PACKAGE_VERSION" \
            --env HERDR_TAILSCALE_HTTPS_PORT=18443 \
            --env GITHUB_SHA="$GITHUB_SHA" \
            --env GITHUB_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            herdr-tailscale-package-browser \
            python3 /workspace/tests/test_tailscale_extracted_package_browser.py
      - name: Upload sanitized extracted-package browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailscale-extracted-package-browser-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/tailscale-package-browser-evidence/tailscale-extracted-package-browser.json
          if-no-files-found: error
          retention-days: 1

  mobile-host-check:
    needs: provenance
    name: Mobile harness checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Assert shell Node runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.13.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - run: make PATH="$PATH" mobile-ci-common-check

  mobile-unit-prepare:
    name: Prepare source-bound mobile unit shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUN_OPTIONS: --no-env-file
      GOTOOLCHAIN: local
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - name: Install XML test tools
        run: |
          set -euo pipefail
          sudo sed -i '\|^http://azure[.]archive[.]ubuntu[.]com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=5s 120s apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=5s 120s apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y libxml2-utils
      - name: Assert pinned runtimes and system prerequisites
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = v26.13.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
          test "$(bun --version)" = 1.4.4
          test "$(go version | awk '{print $3}')" = go1.27.3
          test "$(go env GOTOOLCHAIN)" = local
          tar --version | grep -q '^tar (GNU tar)'
          xmllint --version >/dev/null 2>&1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mobile-unit-cache
        with:
          path: |
            frontend/node_modules
            tests/mobile/node_modules
          key: mobile-unit-${{ runner.os }}-node-26.13.0-bun-1.4.4-${{ hashFiles('frontend/bun.lock', 'tests/mobile/bun.lock') }}
      - name: Install mobile unit dependencies
        id: install-test-dependencies
        if: steps.mobile-unit-cache.outputs.cache-hit != 'true'
        run: |
          bun install --frozen-lockfile --cwd frontend
          bun install --frozen-lockfile --cwd tests/mobile
      - name: Generate and validate authoritative inventory and execution matrix
        id: prepare
        run: >-
          bun --no-env-file tests/mobile/unit/test-shard-ci.ts prepare
          --artifact-dir "$RUNNER_TEMP/unit-ci-prepared"
          --source-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-ci-plan-try-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-ci-prepared/
          if-no-files-found: error
          retention-days: 1

  mobile-unit-shards:
    name: Mobile unit shard group (${{ matrix.group_id }})
    if: needs.mobile-unit-prepare.result == 'success'
    needs: mobile-unit-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUN_OPTIONS: --no-env-file
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.mobile-unit-prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - name: Install XML test tools
        run: |
          set -euo pipefail
          sudo sed -i '\|^http://azure[.]archive[.]ubuntu[.]com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=5s 120s apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=5s 120s apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y libxml2-utils
      - name: Assert pinned runtimes and system prerequisites
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = v26.13.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
          test "$(bun --version)" = 1.4.4
          test "$(go version | awk '{print $3}')" = go1.27.3
          test "$(go env GOTOOLCHAIN)" = local
          tar --version | grep -q '^tar (GNU tar)'
          xmllint --version >/dev/null 2>&1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mobile-unit-cache
        with:
          path: |
            frontend/node_modules
            tests/mobile/node_modules
          key: mobile-unit-${{ runner.os }}-node-26.13.0-bun-1.4.4-${{ hashFiles('frontend/bun.lock', 'tests/mobile/bun.lock') }}
      - name: Install mobile unit dependencies
        id: install-test-dependencies
        if: steps.mobile-unit-cache.outputs.cache-hit != 'true'
        run: |
          bun install --frozen-lockfile --cwd frontend
          bun install --frozen-lockfile --cwd tests/mobile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-ci-plan-try-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-ci-prepared
      - name: Execute every selected P02 shard in this bounded group
        run: >-
          bun --no-env-file tests/mobile/unit/test-shard-ci.ts execute
          --prepared-dir "$RUNNER_TEMP/unit-ci-prepared"
          --group-id "${{ matrix.group_id }}"
          --receipt-dir "$RUNNER_TEMP/unit-ci-${{ matrix.group_id }}"
          --source-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-ci-${{ matrix.group_id }}-try-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-ci-${{ matrix.group_id }}/
          if-no-files-found: error
          retention-days: 1

  mobile-unit-aggregate:
    name: Complete mobile unit shard gate
    if: always()
    needs: [mobile-unit-prepare, mobile-unit-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUN_OPTIONS: --no-env-file
      GOTOOLCHAIN: local
      UNIT_PREPARATION_RESULT: ${{ needs.mobile-unit-prepare.result }}
      UNIT_GROUPS_RESULT: ${{ needs.mobile-unit-shards.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - name: Install XML test tools
        run: |
          set -euo pipefail
          sudo sed -i '\|^http://azure[.]archive[.]ubuntu[.]com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=5s 120s apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=5s 120s apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y libxml2-utils
      - name: Assert pinned runtimes and system prerequisites
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = v26.13.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
          test "$(bun --version)" = 1.4.4
          test "$(go version | awk '{print $3}')" = go1.27.3
          test "$(go env GOTOOLCHAIN)" = local
          tar --version | grep -q '^tar (GNU tar)'
          xmllint --version >/dev/null 2>&1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mobile-unit-cache
        with:
          path: |
            frontend/node_modules
            tests/mobile/node_modules
          key: mobile-unit-${{ runner.os }}-node-26.13.0-bun-1.4.4-${{ hashFiles('frontend/bun.lock', 'tests/mobile/bun.lock') }}
      - name: Install mobile unit dependencies
        id: install-test-dependencies
        if: steps.mobile-unit-cache.outputs.cache-hit != 'true'
        run: |
          bun install --frozen-lockfile --cwd frontend
          bun install --frozen-lockfile --cwd tests/mobile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          pattern: unit-ci-*-try-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-ci-artifacts
          merge-multiple: false
      - name: Verify exact unit shard and leaf completion
        if: always()
        run: >-
          bun --no-env-file tests/mobile/unit/test-shard-ci.ts aggregate
          --artifact-dir "$RUNNER_TEMP/unit-ci-artifacts"
          --source-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT"
          --prepare-result "$UNIT_PREPARATION_RESULT"
          --groups-result "$UNIT_GROUPS_RESULT"

  mobile-inspection-check:
    name: Android installed inspection controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Assert shell Node runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.13.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --cwd tests/mobile
      - run: bun run --cwd tests/mobile test:android-inspection

  mobile:
    name: Mobile device CI
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'dev'))
    needs: [release, mobile-host-check, mobile-inspection-check, mobile-unit-aggregate]
    uses: ./.github/workflows/mobile-ci.yml
    with:
      artifact_run_id: ${{ github.run_id }}
      artifact_name: release-bundles
      candidate_commit: ${{ github.sha }}
      head_commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    permissions:
      actions: read
      contents: read
