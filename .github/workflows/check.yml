name: check

on:
  push:
    branches: [main, dev, ci/tailscale-native-preflight-ef9f843]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  provenance:
    name: Exact checkout provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify event commit, clean state, modes, bytes, and source membership
        run: python3 scripts/verify-checkout-provenance.py --expected-sha "$GITHUB_SHA"
      - name: Exercise provenance refusal cases in disposable Git fixtures
        run: python3 tests/test_checkout_provenance.py

  go:
    needs: provenance
    name: Go quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Format
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './frontend/node_modules/*'))"
      - name: Lint GitHub workflows with pinned actionlint
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -shellcheck= -pyflakes= .github/workflows/check.yml
          .github/workflows/mobile-ci.yml .github/workflows/release.yml
          .github/workflows/tailscale-native-preflight.yml
      - run: go vet ./...
      - run: go test ./...

  tailscale-app-integration:
    needs: provenance
    name: Managed Tailscale app/control integration (${{ matrix.mode }}, hosted, no credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Run exact required app/control cases and write sanitized SHA-bound evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "candidate_sha=$GITHUB_SHA"
          log="$RUNNER_TEMP/tailscale-app-integration-${{ matrix.mode }}.jsonl"
          diagnostics="$RUNNER_TEMP/tailscale-app-integration-${{ matrix.mode }}.stderr"
          evidence="$RUNNER_TEMP/tailscale-app-integration-evidence-${{ matrix.mode }}.json"
          pattern='^(TestManagedTailscaleHostedPositiveActivationArmEnrollAndRetire|TestManagedTailscaleDelayedVerifierCompletesWithinLifecycleBudgets|TestManagedTailscaleVerifierCancellationDoesNotPersistInvitation|TestManagedTailscaleLaterAdmissionFailuresDoNotPersistInvitation|TestManagedTailscaleCommittedArmSurvivesLostControlAcknowledgement|TestManagedTailscaleWatchEOFAtAdmissionHandoffNeverReopensOrEnrolls|TestManagedTailscaleRearmAfterEnrollmentAndLostAcknowledgement)$'
          if [[ "${{ matrix.mode }}" == race ]]; then
            if go test -json -race -tags=herdr_tailscale_test ./internal/app -run "$pattern" -count=1 >"$log" 2>"$diagnostics"; then
              test_exit=0
            else
              test_exit=$?
            fi
          else
            if go test -json -tags=herdr_tailscale_test ./internal/app -run "$pattern" -count=1 >"$log" 2>"$diagnostics"; then
              test_exit=0
            else
              test_exit=$?
            fi
          fi
          cat "$diagnostics" >&2
          python3 - "$log" "$evidence" "$GITHUB_SHA" "${{ matrix.mode }}" "$test_exit" <<'PY'
          import json
          import pathlib
          import sys

          log_path, evidence_path, candidate_sha, mode, test_exit_text = sys.argv[1:]
          required = [
              "TestManagedTailscaleHostedPositiveActivationArmEnrollAndRetire",
              "TestManagedTailscaleDelayedVerifierCompletesWithinLifecycleBudgets",
              "TestManagedTailscaleVerifierCancellationDoesNotPersistInvitation",
              "TestManagedTailscaleLaterAdmissionFailuresDoNotPersistInvitation",
              "TestManagedTailscaleCommittedArmSurvivesLostControlAcknowledgement",
              "TestManagedTailscaleWatchEOFAtAdmissionHandoffNeverReopensOrEnrolls",
              "TestManagedTailscaleRearmAfterEnrollmentAndLostAcknowledgement",
          ]
          actions = {}
          observed_tests = set()
          parse_failed = False
          with pathlib.Path(log_path).open(encoding="utf-8") as stream:
              for line in stream:
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      parse_failed = True
                      continue
                  name = event.get("Test")
                  if name:
                      observed_tests.add(name)
                      actions.setdefault(name, []).append(event.get("Action"))

          results = []
          for name in required:
              terminal = [action for action in actions.get(name, []) if action in {"pass", "skip", "fail"}]
              descendants = [
                  action
                  for test_name, test_actions in actions.items()
                  if test_name.startswith(name + "/")
                  for action in test_actions
                  if action in {"skip", "fail"}
              ]
              if "fail" in terminal or "fail" in descendants:
                  result = "fail"
              elif "skip" in terminal or "skip" in descendants:
                  result = "skip"
              elif terminal == ["pass"] and not descendants:
                  result = "pass"
              elif not terminal:
                  result = "missing"
              else:
                  result = "invalid-event-count"
              results.append({"name": name, "result": result})

          try:
              test_exit = int(test_exit_text)
          except ValueError:
              test_exit = 1
              parse_failed = True
          passed = (
              test_exit == 0
              and bool(observed_tests)
              and all(case["result"] == "pass" for case in results)
              and not parse_failed
          )
          evidence = {
              "schema_version": 1,
              "candidate_sha": candidate_sha,
              "mode": mode,
              "go_test_exit_code": test_exit,
              "test_cases_observed": len(observed_tests),
              "required_cases": results,
              "json_parse_complete": not parse_failed,
              "result": "pass" if passed else "fail",
          }
          pathlib.Path(evidence_path).write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          if not passed:
              print("required tagged integration cases failed evidence validation", file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Upload sanitized integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tailscale-app-integration-evidence-${{ matrix.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/tailscale-app-integration-evidence-${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 1

  journal:
    needs: provenance
    name: Linux journald logging acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Run opt-in user-journal integration test
        env:
          HERDR_TEST_JOURNAL: "1"
        run: go test ./cmd/herdr-mobile-relay -run '^TestJournalIntegration$' -count=1 -v

  # The race detector more than doubles the Go suite, and the shell suites are
  # unrelated to it. Both used to sit behind `go test` in one serial job and
  # decided when every later job could start.
  race:
    needs: provenance
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - run: go test -race ./...

  shell:
    needs: provenance
    name: Shell and production paths
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      # Makefile's PATH assignment is an ordinary makefile variable and can
      # otherwise reintroduce host tools/adapters after a clean step env.
      - name: Run shell checks with a closed tool environment
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          go_bin_dir="$(dirname "$(command -v go)")"
          evidence="$RUNNER_TEMP/tailscale-external-evidence.json"
          env -i \
            HOME="$HOME" TMPDIR="$RUNNER_TEMP" PATH="$go_bin_dir:/usr/bin:/bin" \
            GOTOOLCHAIN=local GITHUB_SHA="$GITHUB_SHA" \
            HERDR_TAILSCALE_LAUNCHER_CI=1 \
            HERDR_EXTERNAL_FIXTURE_EVIDENCE="$evidence" \
            BASH_ENV=/dev/null ENV=/dev/null \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            /usr/bin/make PATH="$go_bin_dir:/usr/bin:/bin" \
              --eval='assert-shell-tools: ; @test "$$(command -v bash)" = /usr/bin/bash && test "$$(command -v sed)" = /usr/bin/sed' \
              assert-shell-tools shell-check production-path-audit
      - name: Upload sanitized operator-owned Serve behavioral evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tailscale-external-behavior-${{ github.sha }}
          path: ${{ runner.temp }}/tailscale-external-evidence.json
          if-no-files-found: error
          retention-days: 1

  frontend:
    needs: provenance
    name: Frontend and mobile browsers (Bun 1.4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - run: bun install --frozen-lockfile --cwd frontend
      # Native browsers instead of the multi-GB Playwright container image:
      # the binaries are the same Playwright-pinned builds either way, and no
      # assertion in the suite depends on the image's font set. Ubuntu is a
      # supported install-deps target; Fedora is not, which is why the
      # container path in run-browser-tests.sh stays for local Fedora runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - run: cd frontend && bun x playwright install --with-deps chromium webkit
      - run: make frontend-check
      - run: make web-release-check

  # Bundles are one of the things this workflow checks, not something it
  # publishes, so they no longer wait behind the test jobs: a red run fails on
  # its own job and a green run stops paying for the serial hop.
  release:
    needs: provenance
    name: Complete release bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Build, manifest, checksum, and offline-verify four targets
        run: |
          make cross-build
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml)"
          scripts/package-release.sh "$version" "$GITHUB_SHA" dist/release
          scripts/check-installed-release.sh \
            "dist/release/herdr-mobile-relay_${version}_linux_amd64.tar.gz" \
            dist/release/checksums.txt "$version" "$GITHUB_SHA" linux/amd64
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundles
          path: dist/release/
          retention-days: 1

  release-native-smoke:
    name: Native release smoke (${{ matrix.target }})
    needs: [release, provenance]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: macos-15
            target: darwin_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-bundles
          path: dist/release
      - name: Exercise packaged relay on its native target
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml)"
          target="${{ matrix.target }}"
          scripts/check-installed-release.sh \
            "dist/release/herdr-mobile-relay_${version}_${{ matrix.target }}.tar.gz" \
            dist/release/checksums.txt "$version" "$GITHUB_SHA" \
            "${target%_*}/${target#*_}"

  tailscale-extracted-package-browser:
    needs: [release, provenance]
    name: Extracted-package Tailscale browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@v8
        with:
          name: release-bundles
          path: dist/release
      - name: Install locked browser tooling and build only the inventory fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -m 700 -p "$RUNNER_TEMP/tailscale-package-browser-evidence"
          printf '{"schema_version":1,"candidate_sha":"%s","current_stage":"runner_image_build","expected_case_count":10,"executed_case_count":0,"result":"not_run"}\n' "$GITHUB_SHA" > "$RUNNER_TEMP/tailscale-package-browser-evidence/tailscale-extracted-package-browser.json"
          bun install --frozen-lockfile --cwd frontend
          go build -trimpath -o "$RUNNER_TEMP/fake-herdr" ./cmd/fake-herdr
          playwright_version="$(node -p "require('./frontend/package.json').devDependencies['@playwright/test']")"
          test "$(grep '^FROM ' tests/tailscale-package-browser.Dockerfile)" = "FROM mcr.microsoft.com/playwright:v${playwright_version}-noble"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml)"
          test -n "$version"
          printf 'HERDR_PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Build pinned disposable runner image
        run: cd tests && docker build --pull --tag herdr-tailscale-package-browser --file tailscale-package-browser.Dockerfile .
      - name: Run exact release archive in network-disabled package fixture
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --add-host relay.tailnet.ts.net:127.0.0.1 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777,size=1g \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --mount "type=bind,src=$PWD/dist/release,dst=/artifact,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/fake-herdr,dst=/fixture-bin/fake-herdr,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/tailscale-package-browser-evidence,dst=/evidence" \
            --env HERDR_EXTRACTED_PACKAGE_BROWSER_CI=1 \
            --env HERDR_PACKAGE_VERSION="$HERDR_PACKAGE_VERSION" \
            --env HERDR_TAILSCALE_HTTPS_PORT=18443 \
            --env GITHUB_SHA="$GITHUB_SHA" \
            --env GITHUB_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            herdr-tailscale-package-browser \
            python3 /workspace/tests/test_tailscale_extracted_package_browser.py
      - name: Upload sanitized extracted-package browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tailscale-extracted-package-browser-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/tailscale-package-browser-evidence/tailscale-extracted-package-browser.json
          if-no-files-found: error
          retention-days: 1

  mobile-host-check:
    needs: provenance
    name: Mobile harness checks
    # The sentinel ref is not in the current push/PR triggers; mobile remains disabled.
    if: ${{ github.ref == 'refs/heads/__mobile-ci-disabled__' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Install required XML test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      - run: make mobile-ci-check

  mobile:
    name: Mobile device CI
    # The sentinel ref is not in the current push/PR triggers; mobile remains disabled.
    if: ${{ github.ref == 'refs/heads/__mobile-ci-disabled__' }}
    needs: [release, mobile-host-check, provenance]
    uses: ./.github/workflows/mobile-ci.yml
    with:
      artifact_run_id: ${{ github.run_id }}
      artifact_name: release-bundles
      candidate_commit: ${{ github.sha }}
      head_commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      platform: all
      suite: ${{ github.ref == 'refs/heads/dev' && 'smoke' || 'release' }}
      baseline_set: ${{ github.ref == 'refs/heads/dev' && 'latest' || 'all' }}
    permissions:
      actions: read
      contents: read
