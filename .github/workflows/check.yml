name: check

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Format
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './frontend/node_modules/*'))"
      - run: go vet ./...
      # Serialize package test binaries: lifecycle subprocess tests use bounded
      # one-second contexts and must not compete with unrelated packages.
      - run: go test -p 1 ./...

  journal:
    name: Linux journald logging acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Run opt-in user-journal integration test
        env:
          HERDR_TEST_JOURNAL: "1"
        run: go test ./cmd/herdr-mobile-relay -run '^TestJournalIntegration$' -count=1 -v

  # The race detector more than doubles the Go suite, and the shell suites are
  # unrelated to it. Both used to sit behind `go test` in one serial job and
  # decided when every later job could start.
  race:
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - run: go test -race -p 1 ./...

  shell:
    name: Shell and production paths
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - run: make shell-check production-path-audit

  frontend:
    name: Frontend and mobile browsers (Bun 1.4.2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Assert shell Node runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.21.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - run: bun install --frozen-lockfile --cwd frontend
      # Native browsers instead of the multi-GB Playwright container image:
      # the binaries are the same Playwright-pinned builds either way, and no
      # assertion in the suite depends on the image's font set. Ubuntu is a
      # supported install-deps target; Fedora is not, which is why the
      # container path in run-browser-tests.sh stays for local Fedora runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      # The Ubuntu mirror has taken from 30 s to more than 44 min to serve the
      # WebKit system packages, so the downloaded packages are cached as well.
      # They are saved right after the install, even if a later check fails.
      - id: playwright-apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: Keep browser system packages for the cache
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/playwright-apt/partial"
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/playwright-apt" \
            | sudo tee /etc/apt/apt.conf.d/90-playwright-archives >/dev/null
      - run: cd frontend && bun x playwright install --with-deps chromium webkit
      - name: Let the cache read the browser system packages
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/playwright-apt"
      - if: steps.playwright-apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright-apt.outputs.cache-primary-key }}
      - run: make PATH="$PATH" frontend-check
      - run: make PATH="$PATH" web-release-check
      # A hung browser leaves only a timeout in the log. The failing tests'
      # Playwright traces (synthetic fixture data) show what the page was doing.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 1
          if-no-files-found: ignore

  # Bundles are one of the things this workflow checks, not something it
  # publishes, so they no longer wait behind the test jobs: a red run fails on
  # its own job and a green run stops paying for the serial hop.
  release:
    name: Complete release bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Assert shell Node runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.21.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Build, manifest, checksum, and offline-verify four targets
        run: |
          make cross-build
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml)"
          scripts/package-release.sh "$version" "$GITHUB_SHA" dist/release
          scripts/check-installed-release.sh \
            "dist/release/herdr-mobile-relay_${version}_linux_amd64.tar.gz" \
            dist/release/checksums.txt "$version" "$GITHUB_SHA" linux/amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundles
          path: dist/release/
          overwrite: true
          retention-days: 1

  release-native-smoke:
    name: Native release smoke (${{ matrix.target }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: macos-15
            target: darwin_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundles
          path: dist/release
      - name: Exercise packaged relay on its native target
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml)"
          target="${{ matrix.target }}"
          scripts/check-installed-release.sh \
            "dist/release/herdr-mobile-relay_${version}_${{ matrix.target }}.tar.gz" \
            dist/release/checksums.txt "$version" "$GITHUB_SHA" \
            "${target%_*}/${target#*_}"

  mobile-host-check:
    name: Mobile harness checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Assert shell Node runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.21.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - run: make PATH="$PATH" mobile-ci-common-check

  mobile-unit-prepare:
    name: Prepare source-bound mobile unit shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUN_OPTIONS: --no-env-file
      GOTOOLCHAIN: local
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Install XML test tools
        run: |
          set -euo pipefail
          sudo sed -i '\|^http://azure[.]archive[.]ubuntu[.]com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=5s 120s apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=5s 120s apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y libxml2-utils
      - name: Assert pinned runtimes and system prerequisites
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = v24.21.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
          test "$(bun --version)" = 1.4.2
          test "$(go version | awk '{print $3}')" = go1.27.1
          test "$(go env GOTOOLCHAIN)" = local
          tar --version | grep -q '^tar (GNU tar)'
          xmllint --version >/dev/null 2>&1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mobile-unit-cache
        with:
          path: |
            frontend/node_modules
            tests/mobile/node_modules
          key: mobile-unit-${{ runner.os }}-node-24.21.0-bun-1.4.2-${{ hashFiles('frontend/bun.lock', 'tests/mobile/bun.lock') }}
      - name: Install mobile unit dependencies
        id: install-test-dependencies
        if: steps.mobile-unit-cache.outputs.cache-hit != 'true'
        run: |
          bun install --frozen-lockfile --cwd frontend
          bun install --frozen-lockfile --cwd tests/mobile
      - name: Generate and validate authoritative inventory and execution matrix
        id: prepare
        run: >-
          bun --no-env-file tests/mobile/unit/test-shard-ci.ts prepare
          --artifact-dir "$RUNNER_TEMP/unit-ci-prepared"
          --source-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-ci-plan-try-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-ci-prepared/
          if-no-files-found: error
          retention-days: 1

  mobile-unit-shards:
    name: Mobile unit shard group (${{ matrix.group_id }})
    if: needs.mobile-unit-prepare.result == 'success'
    needs: mobile-unit-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUN_OPTIONS: --no-env-file
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.mobile-unit-prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Install XML test tools
        run: |
          set -euo pipefail
          sudo sed -i '\|^http://azure[.]archive[.]ubuntu[.]com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=5s 120s apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=5s 120s apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y libxml2-utils
      - name: Assert pinned runtimes and system prerequisites
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = v24.21.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
          test "$(bun --version)" = 1.4.2
          test "$(go version | awk '{print $3}')" = go1.27.1
          test "$(go env GOTOOLCHAIN)" = local
          tar --version | grep -q '^tar (GNU tar)'
          xmllint --version >/dev/null 2>&1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mobile-unit-cache
        with:
          path: |
            frontend/node_modules
            tests/mobile/node_modules
          key: mobile-unit-${{ runner.os }}-node-24.21.0-bun-1.4.2-${{ hashFiles('frontend/bun.lock', 'tests/mobile/bun.lock') }}
      - name: Install mobile unit dependencies
        id: install-test-dependencies
        if: steps.mobile-unit-cache.outputs.cache-hit != 'true'
        run: |
          bun install --frozen-lockfile --cwd frontend
          bun install --frozen-lockfile --cwd tests/mobile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-ci-plan-try-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-ci-prepared
      - name: Execute every selected P02 shard in this bounded group
        run: >-
          bun --no-env-file tests/mobile/unit/test-shard-ci.ts execute
          --prepared-dir "$RUNNER_TEMP/unit-ci-prepared"
          --group-id "${{ matrix.group_id }}"
          --receipt-dir "$RUNNER_TEMP/unit-ci-${{ matrix.group_id }}"
          --source-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-ci-${{ matrix.group_id }}-try-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-ci-${{ matrix.group_id }}/
          if-no-files-found: error
          retention-days: 1

  mobile-unit-aggregate:
    name: Complete mobile unit shard gate
    if: always()
    needs: [mobile-unit-prepare, mobile-unit-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUN_OPTIONS: --no-env-file
      GOTOOLCHAIN: local
      UNIT_PREPARATION_RESULT: ${{ needs.mobile-unit-prepare.result }}
      UNIT_GROUPS_RESULT: ${{ needs.mobile-unit-shards.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Install XML test tools
        run: |
          set -euo pipefail
          sudo sed -i '\|^http://azure[.]archive[.]ubuntu[.]com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=5s 120s apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=5s 120s apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y libxml2-utils
      - name: Assert pinned runtimes and system prerequisites
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = v24.21.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
          test "$(bun --version)" = 1.4.2
          test "$(go version | awk '{print $3}')" = go1.27.1
          test "$(go env GOTOOLCHAIN)" = local
          tar --version | grep -q '^tar (GNU tar)'
          xmllint --version >/dev/null 2>&1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mobile-unit-cache
        with:
          path: |
            frontend/node_modules
            tests/mobile/node_modules
          key: mobile-unit-${{ runner.os }}-node-24.21.0-bun-1.4.2-${{ hashFiles('frontend/bun.lock', 'tests/mobile/bun.lock') }}
      - name: Install mobile unit dependencies
        id: install-test-dependencies
        if: steps.mobile-unit-cache.outputs.cache-hit != 'true'
        run: |
          bun install --frozen-lockfile --cwd frontend
          bun install --frozen-lockfile --cwd tests/mobile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          pattern: unit-ci-*-try-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-ci-artifacts
          merge-multiple: false
      - name: Verify exact unit shard and leaf completion
        if: always()
        run: >-
          bun --no-env-file tests/mobile/unit/test-shard-ci.ts aggregate
          --artifact-dir "$RUNNER_TEMP/unit-ci-artifacts"
          --source-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT"
          --prepare-result "$UNIT_PREPARATION_RESULT"
          --groups-result "$UNIT_GROUPS_RESULT"

  mobile-inspection-check:
    name: Android installed inspection controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Assert shell Node runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.21.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --cwd tests/mobile
      - run: bun run --cwd tests/mobile test:android-inspection

  mobile:
    name: Mobile device CI
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'dev'))
    needs: [release, mobile-host-check, mobile-inspection-check, mobile-unit-aggregate]
    uses: ./.github/workflows/mobile-ci.yml
    with:
      artifact_run_id: ${{ github.run_id }}
      artifact_name: release-bundles
      candidate_commit: ${{ github.sha }}
      head_commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    permissions:
      actions: read
      contents: read
