name: release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Require successful check and full service qualification
    runs-on: ubuntu-latest
    # The script below waits up to 1800 seconds for both workflows; 45 minutes leaves
    # headroom and stays under the 60-minute hosted-job ceiling.
    timeout-minutes: 45
    steps:
      - name: Require successful check workflow and full service qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The fast per-push Service qualification is NOT accepted here. Full service qualification must have
          # succeeded for exactly this commit, from a run that tested the commit's own bytes (workflow_dispatch
          # or the nightly schedule: a pull_request run tested a merge commit, not this one). None found is a
          # failure, not a wait: dispatch "Full service qualification" for the commit, then re-run this job.
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            state="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow check.yml \
                --commit "$GITHUB_SHA" \
                --limit 20 \
                --json status,conclusion \
                --jq '
                  if any(.[]; .conclusion == "success") then "success"
                  elif length == 0 or any(.[]; .status != "completed") then "pending"
                  else "failed"
                  end
                '
            )"
            full="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow service-full-qualification.yml \
                --commit "$GITHUB_SHA" \
                --limit 20 \
                --json status,conclusion,event \
                --jq '
                  map(select(.event == "workflow_dispatch" or .event == "schedule")) as $runs
                  | if any($runs[]; .conclusion == "success") then "success"
                    elif any($runs[]; .status != "completed") then "pending"
                    else "failed"
                    end
                '
            )"
            case "$state" in
              failed)
                echo "Tagged commit $GITHUB_SHA has no successful check.yml run." >&2
                exit 1
                ;;
            esac
            case "$full" in
              failed)
                echo "Tagged commit $GITHUB_SHA has no successful Full service qualification run (dispatch or nightly)." >&2
                exit 1
                ;;
            esac
            if [ "$state" = success ] && [ "$full" = success ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for check.yml and Full service qualification on tagged commit $GITHUB_SHA." >&2
          exit 1

  build:
    needs: verify
    runs-on: ubuntu-latest
    # The same build and packaging steps carry a 30-minute cap in check.yml.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Assert shell Node runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.13.0
          test "$(command -v node)" = "$(node -p 'process.execPath')"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --cwd frontend
      - name: Build release bundles
        run: |
          make cross-build
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml)"
          test "$version" = "$manifest_version" || {
            echo "Tag version $version does not match plugin version $manifest_version." >&2
            exit 1
          }
          scripts/package-release.sh "$version" "$GITHUB_SHA" dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundles
          path: dist/release/
          retention-days: 1

  native-smoke:
    name: Native release smoke (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: macos-15
            target: darwin_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundles
          path: dist/release
      - name: Exercise packaged relay on its native target
        run: |
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          scripts/check-installed-release.sh \
            "dist/release/herdr-mobile-relay_${version}_${{ matrix.target }}.tar.gz" \
            dist/release/checksums.txt "$version" "$GITHUB_SHA" \
            "${target%_*}/${target#*_}"

  mobile:
    needs: build
    uses: ./.github/workflows/mobile-ci.yml
    with:
      artifact_run_id: ${{ github.run_id }}
      artifact_name: release-bundles
      candidate_commit: ${{ github.sha }}
      head_commit: ${{ github.sha }}
    permissions:
      actions: read
      contents: read

  publish:
    needs: [verify, build, native-smoke, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require this release's strict mobile qualification
        env:
          QUALIFICATION_STATUS: ${{ needs.mobile.outputs.qualification_status }}
        run: |
          set -euo pipefail
          test "$QUALIFICATION_STATUS" = PASS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundles
          path: dist/release
      - name: Publish verified complete bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Candidates are tagged on dev, so a tag is only a stable release once
          # its commit is on main. Until then it ships as a prerelease, which the
          # relay's update check skips, and promotion flips it with
          # `gh release edit --prerelease=false --latest`.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            on_main=1
          else
            # 1 means "not on main"; any other status is a real git failure.
            status=$?
            test "$status" -eq 1 || exit "$status"
            on_main=0
          fi
          assets=(
            dist/release/checksums.txt
            dist/release/herdr-mobile-relay_*.tar.gz
          )
          if prerelease="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease \
              --jq .isPrerelease 2>/dev/null
          )"; then
            # A candidate tag moves as dev advances, so its release already
            # exists. Every bundle embeds the commit it was built from, so the
            # assets must be replaced: leaving them would advertise this tag
            # with a revision the relay refuses to install.
            if [ "$prerelease" = false ] && [ "$on_main" -eq 0 ]; then
              echo "Release $GITHUB_REF_NAME is already promoted; refusing to republish it from a commit that is not on main." >&2
              exit 1
            fi
            if [ "$on_main" -eq 1 ]; then
              visibility=(--latest --prerelease=false)
            else
              visibility=(--prerelease)
            fi
            # `gh release edit` cannot generate notes, so ask for the same body
            # the create path would have written.
            notes="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                -f tag_name="$GITHUB_REF_NAME" \
                -f target_commitish="$GITHUB_SHA" \
                --jq .body
            )"
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --notes "$notes" \
              "${visibility[@]}"
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${assets[@]}"
            exit 0
          fi
          if [ "$on_main" -eq 1 ]; then
            visibility=(--latest)
          else
            visibility=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "${visibility[@]}" \
            "${assets[@]}"
