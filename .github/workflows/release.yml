name: release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  verify:
    name: Require successful check workflow
    runs-on: ubuntu-latest
    steps:
      - name: Verify tagged commit passed check.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow check.yml \
              --commit "$GITHUB_SHA" \
              --status success \
              --json databaseId \
              --jq 'length'
          )"
          test "$count" -gt 0 || {
            echo "Tagged commit $GITHUB_SHA has no successful check.yml run." >&2
            exit 1
          }

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Build release bundles
        run: |
          make cross-build
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml)"
          test "$version" = "$manifest_version" || {
            echo "Tag version $version does not match plugin version $manifest_version." >&2
            exit 1
          }
          scripts/package-release.sh "$version" "$GITHUB_SHA" dist/release
      - uses: actions/upload-artifact@v6
        with:
          name: release-bundles
          path: dist/release/

  native-smoke:
    name: Native release smoke (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: macos-15
            target: darwin_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-bundles
          path: dist/release
      - name: Exercise packaged relay on its native target
        run: |
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          scripts/check-installed-release.sh \
            "dist/release/herdr-mobile-relay_${version}_${{ matrix.target }}.tar.gz" \
            dist/release/checksums.txt "$version" "$GITHUB_SHA" \
            "${target%_*}/${target#*_}"

  publish:
    needs: [verify, build, native-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-bundles
          path: dist/release
      - name: Publish verified complete bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            dist/release/checksums.txt \
            dist/release/herdr-mobile-relay_*.tar.gz
