name: release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  verify:
    name: Require successful check workflow
    runs-on: ubuntu-latest
    steps:
      - name: Verify tagged commit passed check.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow check.yml \
              --commit "$GITHUB_SHA" \
              --status success \
              --json databaseId \
              --jq 'length'
          )"
          test "$count" -gt 0 || {
            echo "Tagged commit $GITHUB_SHA has no successful check.yml run." >&2
            exit 1
          }

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Build release bundles
        run: |
          make cross-build
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml)"
          test "$version" = "$manifest_version" || {
            echo "Tag version $version does not match plugin version $manifest_version." >&2
            exit 1
          }
          scripts/package-release.sh "$version" "$GITHUB_SHA" dist/release
          scripts/check-installed-release.sh \
            "dist/release/herdr-mobile-relay_${version}_linux_amd64.tar.gz"
      - name: Publish verified complete bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            dist/release/checksums.txt \
            dist/release/herdr-mobile-relay_*.tar.gz
