name: Service qualification

on:
  push:
    branches: [ci/tailscale-native-preflight-ef9f843]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

# A thin wrapper: every guard, suite, bound and fail-closed rule lives in
# scripts/ci/run-service-qualification.sh. macOS runs the stock /bin/bash 3.2,
# Ubuntu runs bash 5. No retries, no secrets, no continue-on-error.
# The script bounds each suite with a fixed wall-clock limit; this workflow adds
# only the 60-minute job cap. Nine suites at their bounds can exceed that cap:
# GitHub then cancels a pathologically slow or hung run, which is a red job with
# a missing artifact, never a pass.
jobs:
  service-qualification:
    name: Service qualification (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    # Each setup step has its own plain hang bound (timeout-minutes), nothing more.
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          fetch-depth: 1
          persist-credentials: false
      # Python is pinned, not the runner image's ambient python3: the provenance step
      # and the script's supervisor and suites all run under this exact version (the
      # script itself requires 3.11 or newer, for process_group and tomllib).
      - uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: "3.14.0"
      - name: Verify event commit, clean state, modes, bytes, and source membership
        timeout-minutes: 3
        run: python3 scripts/verify-checkout-provenance.py --expected-sha "$GITHUB_SHA"
      - uses: actions/setup-go@v7
        timeout-minutes: 8
        with:
          go-version: 1.27.1
          cache: false
      - uses: oven-sh/setup-bun@v2
        timeout-minutes: 5
        with:
          bun-version: 1.4.0
      - name: Run the service and installer suites
        run: /bin/bash scripts/ci/run-service-qualification.sh
      - name: Upload sanitized service qualification summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: service-qualification-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/service-qualification/summary.json
          if-no-files-found: error
          retention-days: 1
