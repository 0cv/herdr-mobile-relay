name: Service qualification

on:
  push:
    branches: [ci/tailscale-native-preflight-ef9f843]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

# A thin wrapper: every guard, suite, bound and fail-closed rule lives in
# scripts/ci/run-service-qualification.sh. macOS runs the stock /bin/bash 3.2,
# Ubuntu runs bash 5. No retries, no secrets, no continue-on-error. The first
# step records the job start time; the script measures its aggregate time
# budget (inside this 60-minute job cap) from that moment, so checkout and
# toolchain setup count against it, attempts every suite and writes the summary
# that the upload step requires. It cannot prevent the cap from being reached
# if the earlier steps consume most of it or the runner or Actions hangs: the
# job is then cancelled, a red job with a missing artifact, never a pass.
jobs:
  service-qualification:
    name: Service qualification (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - name: Record the job start time
        run: echo "SERVICE_QUALIFICATION_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify event commit, clean state, modes, bytes, and source membership
        run: python3 scripts/verify-checkout-provenance.py --expected-sha "$GITHUB_SHA"
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Run the service and installer suites
        run: /bin/bash scripts/ci/run-service-qualification.sh
      - name: Upload sanitized service qualification summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: service-qualification-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/service-qualification/summary.json
          if-no-files-found: error
          retention-days: 1
