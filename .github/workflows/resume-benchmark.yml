name: Resume benchmark pilot

# On demand only. This pilot used to run in check.yml on every push and pull
# request; it is research evidence, not a functional gate, so it now runs only
# when someone dispatches it for an exact commit. The job body, its exact
# provenance check, preflight, sanitized evidence upload and timeouts are
# unchanged from check.yml. The benchmark itself is unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  provenance:
    name: Exact checkout provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify event commit, clean state, modes, bytes, and source membership
        run: python3 scripts/verify-checkout-provenance.py --expected-sha "$GITHUB_SHA"
      - name: Exercise provenance refusal cases in disposable Git fixtures
        run: python3 tests/test_checkout_provenance.py

  # Statistical evidence is kept apart from functional tests so that neither
  # is mistaken for the other. This bounded pilot measures the shipped web/
  # bundle of this exact commit against the in-page synthetic relay, keeps
  # every attempted epoch, and plans a later confirmatory experiment. It is
  # not p95 acceptance and supports no performance claim.
  resume-benchmark-pilot:
    needs: provenance
    name: Resume benchmark pilot (synthetic, hosted; not a functional test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --cwd frontend
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - run: cd frontend && bun x playwright install --with-deps chromium webkit
      - name: Preflight supported resume paint composition (not pilot epochs)
        run: >-
          cd frontend && HERDR_WEB_ROOT="$GITHUB_WORKSPACE/web"
          bun x playwright test tests/browser/resume.spec.ts
          --grep 'paint composition preflight$' --retries=0 --workers=1
      - name: Run the preregistered pilot on the exact checkout and analyze every attempted epoch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/resume-benchmark"
          make resume-benchmark-pilot RESUME_BENCHMARK_SHA="$GITHUB_SHA" RESUME_BENCHMARK_DIR="$evidence"
          cat "$evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized pilot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resume-benchmark-pilot-${{ github.sha }}
          path: |
            ${{ runner.temp }}/resume-benchmark/preregistration.json
            ${{ runner.temp }}/resume-benchmark/evidence.json
            ${{ runner.temp }}/resume-benchmark/analysis.json
            ${{ runner.temp }}/resume-benchmark/summary.md
          if-no-files-found: warn
          retention-days: 1
