name: B2 source verification and generated assets

on:
  push:
    branches: [ci/tailscale-native-preflight-ef9f843]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify exact source provenance
        run: python3 scripts/verify-checkout-provenance.py --expected-sha "$GITHUB_SHA"
      - name: Focused Go tests including inventory barriers
        run: go test -race ./internal/app ./internal/coordinator ./internal/protocol
      - run: bun install --frozen-lockfile --cwd frontend
      - name: Verify source and generate assets only through the release pipeline
        run: |
          make frontend-check
          if diff -qr frontend/dist web; then
            make web-bundle-check
          else
            make web-release
          fi
      - name: Install hosted browser engines
        run: cd frontend && bun x playwright install --with-deps chromium webkit
      - name: Focused packaged B2 and deferred-surface regressions
        # Stop this diagnostic subset promptly on failure; acceptance still
        # requires the complete, unchanged suite in the next step.
        run: cd frontend && HERDR_WEB_ROOT=../web bun x playwright test tests/browser/last-known.spec.ts tests/browser/resume.spec.ts tests/browser/workspace-tools.spec.ts --max-failures=1
      - name: Functional packaged browser regressions
        run: make frontend-browser-release
      - name: Retain synthetic browser failure context
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: b2-browser-failure-context-${{ github.sha }}
          path: frontend/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 1
      - name: Record source and artifact binding
        run: |
          printf '%s\n' "$GITHUB_SHA" > b2-source-sha.txt
          find web -type f -print0 | sort -z | xargs -0 sha256sum > b2-assets.sha256
          sha256sum frontend/build-versions.json >> b2-assets.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: b2-generated-assets-${{ github.sha }}
          path: |
            web/
            frontend/build-versions.json
            b2-source-sha.txt
            b2-assets.sha256
          if-no-files-found: error
          retention-days: 1
