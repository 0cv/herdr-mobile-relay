name: setup-toolchain
description: Install the Node, Bun and Go versions pinned in tests/mobile/toolchains.json and go.mod
inputs:
  node:
    default: 'false'
  bun:
    default: 'false'
  go:
    default: 'false'
outputs:
  node:
    value: ${{ steps.versions.outputs.node }}
  bun:
    value: ${{ steps.versions.outputs.bun }}
  go:
    value: ${{ steps.versions.outputs.go }}
runs:
  using: composite
  steps:
    - name: Read pinned versions
      id: versions
      run: |
        set -euo pipefail
        printf 'node=%s\n' "$(jq -er .node tests/mobile/toolchains.json)" >> "$GITHUB_OUTPUT"
        printf 'bun=%s\n' "$(jq -er .bun tests/mobile/toolchains.json)" >> "$GITHUB_OUTPUT"
        printf 'go=%s\n' "$(sed -n 's/^go //p' go.mod)" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.versions.outputs.node }}
    - name: Assert shell Node runtime
      if: inputs.node == 'true'
      env:
        NODE_VERSION: ${{ steps.versions.outputs.node }}
      run: |
        set -euo pipefail
        test "$(node --version)" = "v$NODE_VERSION"
        test "$(command -v node)" = "$(node -p 'process.execPath')"
      shell: bash
    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.versions.outputs.bun }}
    - if: inputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.versions.outputs.go }}
        cache: true
